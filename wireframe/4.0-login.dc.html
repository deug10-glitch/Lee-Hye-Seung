<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Gempick 로그인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#f6f6f6}
a{color:#1a1a1a}a:hover{color:#000000}
</style>
</helmet>
<div style="font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1a1a1a; background: #f6f6f6; min-height: 100vh; padding: 48px 24px; box-sizing: border-box">
  <div style="max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="font-size: 24px; font-weight: 700">Gempick</div>
      <button type="button" aria-label="닫고 이전 화면으로" style="width: 44px; height: 44px; border: 1px solid #a8a8a8; border-radius: 8px; background: #ffffff; font: inherit; font-size: 18px">×</button>
    </div>

    <div role="alert" style="border: 1px solid #1a1a1a; border-radius: 10px; padding: 12px 16px; background: #ffffff; font-size: 14px">
      <strong>[실패·취소 시에만 표시]</strong> 로그인하지 못했어요. 다시 시도하거나 게스트로 계속할 수 있어요.
    </div>

    <section aria-labelledby="login-title" style="background: #ffffff; border: 1px solid #d0d0d0; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; gap: 16px; align-items: flex-start">
        <div aria-hidden="true" style="flex: 0 0 64px; height: 64px; border-radius: 50%; background: #d9d9d9; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #555555">마스코트</div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 id="login-title" style="margin: 0; font-size: 24px">로그인하지 않아도 쓸 수 있어요</h1>
          <p style="margin: 0; font-size: 15px; color: #555555">간편 로그인이나 게스트로 시작하세요.</p>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 14px; font-weight: 700">간편 로그인</span>
        <button type="button" style="height: 52px; border: 1px solid #1a1a1a; border-radius: 10px; background: #ffffff; font: inherit; font-size: 15px">[간편 로그인 방식 1]로 계속하기</button>
        <button type="button" style="height: 52px; border: 1px solid #1a1a1a; border-radius: 10px; background: #ffffff; font: inherit; font-size: 15px">[간편 로그인 방식 2]로 계속하기</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #d0d0d0; padding-top: 20px">
        <button type="button" style="height: 52px; border: none; border-radius: 10px; background: #1a1a1a; color: #ffffff; font: inherit; font-size: 15px; font-weight: 700">게스트로 계속하기</button>
        <p style="margin: 0; font-size: 13px; color: #555555">게스트는 다음에 다시 와도 기기 설정 등 정보를 기억하지 못해요.</p>
      </div>

      <div style="border: 1px solid #d0d0d0; border-radius: 10px; padding: 14px 16px; background: #f6f6f6; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 700">로그인하면 좋은 점</span>
        <span style="font-size: 14px">내 기기 설정 기억 · 고른 조건 저장 · 맞춤 추천</span>
      </div>

      <p style="margin: 0; font-size: 13px; color: #555555">어느 쪽이든 다음은 1.0 기기 설정 → 원래 보던 화면</p>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
