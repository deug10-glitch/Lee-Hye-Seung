<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Gempick 내 기기 설정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#f6f6f6}
a{color:#1a1a1a}a:hover{color:#000000}
</style>
</helmet>
<div style="font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1a1a1a; background: #f6f6f6; min-height: 100vh; padding: 48px 24px; box-sizing: border-box">
  <div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="font-size: 24px; font-weight: 700">Gempick</div>
      <span style="font-size: 13px; color: #555555">가입 2 / 2단계</span>
    </div>

    <section aria-labelledby="dev-title" style="background: #ffffff; border: 1px solid #d0d0d0; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; gap: 16px; align-items: flex-start">
        <div aria-hidden="true" style="flex: 0 0 64px; height: 64px; border-radius: 50%; background: #d9d9d9; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #555555">마스코트</div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 id="dev-title" style="margin: 0; font-size: 26px">어떤 기기로 게임하세요?</h1>
          <p style="margin: 0; font-size: 15px; color: #555555">선택사항이에요. 고른 기기 기준으로 결과를 좁혀 드리고, 설정에서 언제든 바꿀 수 있어요.</p>
        </div>
      </div>

      <fieldset style="margin: 0; padding: 0; border: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px">
        <legend style="font-size: 14px; font-weight: 700; margin-bottom: 12px">보유 기기 (여러 개 선택 가능)</legend>
        <sc-for list="{{devices}}" as="d" hint-placeholder-count="3">
          <label style="{{d.style}}">
            <span style="display: flex; align-items: center; gap: 10px">
              <input type="checkbox" checked="{{d.checked}}" style="width: 20px; height: 20px; margin: 0">
              <span style="font-size: 18px; font-weight: 700">{{d.name}}</span>
            </span>
            <span aria-hidden="true" style="height: 72px; border-radius: 8px; background: #e4e4e4; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #555555">기기 아이콘</span>
            <span style="font-size: 13px; color: #555555">{{d.sub}}</span>
          </label>
        </sc-for>
      </fieldset>

      <div style="border-top: 1px solid #d0d0d0; padding-top: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
        <p style="margin: 0; font-size: 13px; color: #555555; flex: 1 1 280px">건너뛰면 모든 기기의 게임이 플랫폼 배지와 함께 보여요. 결과 화면의 전체 · 모바일 · PC · 콘솔 탭으로 나눠 볼 수 있어요.</p>
        <div style="display: flex; gap: 12px">
          <button type="button" style="height: 48px; padding: 0 20px; border: 1px solid #a8a8a8; border-radius: 8px; background: #ffffff; font: inherit; font-size: 15px">건너뛰기</button>
          <button type="button" style="height: 48px; padding: 0 24px; border: none; border-radius: 8px; background: #1a1a1a; color: #ffffff; font: inherit; font-size: 15px; font-weight: 700">완료하고 시작하기</button>
        </div>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    var on = 'border: 2px solid #1a1a1a; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; background: #ffffff';
    var off = 'border: 1px solid #a8a8a8; border-radius: 12px; padding: 17px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; background: #ffffff';
    var devices = [
      { name: '모바일', sub: 'iOS · Android', checked: true },
      { name: 'PC', sub: 'Steam · 에픽 · PC방', checked: true },
      { name: '콘솔', sub: '스위치 · PS · Xbox', checked: false }
    ].map(function (d) { return Object.assign({}, d, { style: d.checked ? on : off }); });
    return { devices: devices };
  }
}
</script>
</body>
</html>
