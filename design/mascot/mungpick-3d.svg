<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460">
<defs>
  <radialGradient id="fur" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f6f4fd"/><stop offset=".85" stop-color="#e4def6"/><stop offset="1" stop-color="#d2c8ef"/></radialGradient>
  <radialGradient id="furB" cx="40%" cy="25%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f1eefb"/><stop offset="1" stop-color="#cfc6ec"/></radialGradient>
  <radialGradient id="pur" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#9b7bff"/><stop offset=".55" stop-color="#6c3bff"/><stop offset="1" stop-color="#4a20c8"/></radialGradient>
  <radialGradient id="eye" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#3b3270"/><stop offset=".7" stop-color="#1b1640"/><stop offset="1" stop-color="#0e0b24"/></radialGradient>
  <radialGradient id="tongue" cx="50%" cy="30%" r="70%"><stop offset="0" stop-color="#ffb3be"/><stop offset="1" stop-color="#f0708a"/></radialGradient>
  <radialGradient id="cheek" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb0c4" stop-opacity=".75"/><stop offset="1" stop-color="#ffb0c4" stop-opacity="0"/></radialGradient>
  <radialGradient id="tag" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#e6ff8a"/><stop offset=".6" stop-color="#c6ff3d"/><stop offset="1" stop-color="#8fc21a"/></radialGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="ao" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="hl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<!-- ground shadow -->
<ellipse cx="200" cy="438" rx="110" ry="14" fill="#5326e0" opacity=".18" filter="url(#soft)"/>
<!-- legs -->
<g><path d="M150 360 q-4 62 6 70 q30 8 44 -2 q6 -30 2 -68z" fill="url(#furB)"/>
<path d="M200 360 q-4 40 2 68 q14 10 44 2 q10 -8 6 -70z" fill="url(#furB)"/>
<path d="M153 405 q22 8 48 0 l1 14 q-25 8 -49 0z" fill="url(#pur)"/>
<path d="M199 405 q24 8 48 0 l-1 14 q-24 8 -48 0z" fill="url(#pur)"/></g>
<!-- body -->
<path d="M128 290 q-6 80 30 96 q42 14 84 0 q36 -16 30 -96 q-72 -30 -144 0z" fill="url(#furB)"/>
<!-- arms -->
<path d="M132 300 q-34 14 -36 52 q2 18 20 16 q14 -20 24 -40z" fill="url(#furB)"/>
<path d="M268 300 q34 14 36 52 q-2 18 -20 16 q-14 -20 -24 -40z" fill="url(#furB)"/>
<path d="M99 340 q8 8 22 6 l-4 14 q-14 2 -20 -6z" fill="url(#pur)"/>
<path d="M301 340 q-8 8 -22 6 l4 14 q14 2 20 -6z" fill="url(#pur)"/>
<!-- head shadow on body -->
<ellipse cx="200" cy="292" rx="88" ry="20" fill="#7a63c9" opacity=".35" filter="url(#ao)"/>
<!-- collar -->
<path d="M140 280 q60 26 120 0 l2 16 q-62 28 -124 0z" fill="url(#pur)"/>
<circle cx="200" cy="306" r="17" fill="url(#tag)"/>
<path d="M195 298 l12 8 l-12 8z" fill="#3a2a8a"/>
<ellipse cx="194" cy="298" rx="5" ry="3" fill="#fff" opacity=".7"/>
<!-- ears (behind head) -->
<g id="earL"><path d="M112 82 q-58 14 -76 84 q-10 52 18 74 q26 14 44 -14 q22 -40 30 -96 q2 -32 -16 -48z" fill="url(#fur)"/>
<ellipse cx="72" cy="140" rx="20" ry="36" transform="rotate(28 72 140)" fill="url(#pur)"/>
<ellipse cx="70" cy="118" rx="12" ry="6" transform="rotate(-50 70 118)" fill="#fff" opacity=".45" filter="url(#hl)"/></g>
<use href="#earL" transform="translate(400 0) scale(-1 1)"/>
<!-- head -->
<ellipse cx="200" cy="170" rx="116" ry="108" fill="url(#fur)"/>
<ellipse cx="160" cy="105" rx="46" ry="26" fill="#fff" opacity=".9" filter="url(#hl)"/>
<!-- cheeks -->
<ellipse cx="128" cy="210" rx="26" ry="16" fill="url(#cheek)"/>
<ellipse cx="272" cy="210" rx="26" ry="16" fill="url(#cheek)"/>
<!-- eyes -->
<ellipse cx="148" cy="180" rx="22" ry="25" fill="url(#eye)"/>
<ellipse cx="252" cy="180" rx="22" ry="25" fill="url(#eye)"/>
<circle cx="141" cy="170" r="7" fill="#fff"/><circle cx="155" cy="190" r="3" fill="#fff" opacity=".8"/>
<circle cx="245" cy="170" r="7" fill="#fff"/><circle cx="259" cy="190" r="3" fill="#fff" opacity=".8"/>
<!-- nose -->
<path d="M178 200 q22 -12 44 0 q4 14 -22 24 q-26 -10 -22 -24z" fill="url(#eye)"/>
<ellipse cx="194" cy="202" rx="8" ry="4" fill="#fff" opacity=".75"/>
<!-- mouth -->
<path d="M200 223 v5 M182 228 q18 16 36 0" stroke="#1b1640" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M186 232 q14 32 28 0 q-14 8 -28 0z" fill="url(#tongue)"/>
</svg>
